<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>老莫聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        /* ========== 左侧栏 ========== */
        .sidebar {
            width: 250px;
            background-color: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
        }
        .user-info {
            padding: 20px;
            border-bottom: 1px solid #eee;
            text-align: center;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .user-info h3 {
            font-size: 18px;
            margin: 0;
        }
        #logout-btn {
            padding: 6px 12px;
            font-size: 14px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #logout-btn:hover {
            background: #d32f2f;
        }
        .actions {
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        .session-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .session-item {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .session-item:hover {
            background-color: #f9f9f9;
        }
        .session-item.active {
            background-color: #e3f2fd;
            font-weight: bold;
        }
        .session-name {
            font-size: 16px;
        }
        .session-time {
            font-size: 12px;
            color: #888;
        }
        /* ========== 聊天主区域 ========== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #fff;
        }
        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            font-size: 18px;
            font-weight: bold;
        }
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .message {
            max-width: 70%;
            padding: 10px 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            position: relative;
            word-wrap: break-word;
        }
        .sent {
            align-self: flex-end;
            background-color: #dcf8c6;
        }
        .received {
            align-self: flex-start;
            background-color: #f1f0f0;
        }
        .input-area {
            padding: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }
        .input-area button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        .system-message {
            text-align: center;
            color: #888;
            font-style: italic;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- 左侧会话列表 -->
        <div class="sidebar">
            <div class="user-info">
                <h3 id="current-username">加载中...</h3>
                <button id="logout-btn">退出登录</button>
            </div>
            <div class="actions">
                <button id="create-group">创建群聊</button>
                <button id="join-group">加入群聊</button>
            </div>
            <ul class="session-list" id="session-list">
                <!-- 会话项将通过 JS 动态生成 -->
            </ul>
        </div>

        <!-- 右侧聊天区域 -->
        <div class="main">
            <div class="chat-header" id="chat-header">请选择一个会话</div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="输入消息..." disabled />
                <button id="send-btn" disabled>发送</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 全局变量 ==========
        let websocket = null;
        let username = '';
        let currentSession = null; // { target: string, type: 'private'|'group', name: string }
        const sessions = new Map(); // key: target (username or group_id), value: message[]
        const groupInfo = {}; // group_id -> { name, creator, created_at }

        // ========== DOM 元素 ==========
        const sessionListEl = document.getElementById('session-list');
        const messagesEl = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatHeader = document.getElementById('chat-header');
        const createGroupBtn = document.getElementById('create-group');
        const joinGroupBtn = document.getElementById('join-group');
        const currentUsernameEl = document.getElementById('current-username');

        // ========== 初始化 WebSocket ==========
        function initWebSocket() {
            // 🔑 从 localStorage 获取登录凭证（由 login.html 设置）
            const savedUsername = localStorage.getItem('mo_chat_username');
            const savedPassword = localStorage.getItem('mo_chat_password');

            if (!savedUsername || !savedPassword) {
                alert('未检测到登录信息，请先登录！');
                window.location.href = '/web/login.html';
                return;
            }

            const wsUrl = `ws://${window.location.host}/ws`;
            websocket = new WebSocket(wsUrl);

            websocket.onopen = () => {
                console.log("WebSocket 连接成功，正在发送登录请求...");
                // 👇 关键：自动发送 login 消息！
                websocket.send(JSON.stringify({
                    type: 'login',
                    username: savedUsername,
                    password: savedPassword
                }));
            };

            websocket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                console.log("收到服务器消息:", msg); // 调试用，上线可移除
                handleServerMessage(msg);
            };

            websocket.onerror = (error) => {
                console.error("WebSocket 错误:", error);
                alert("连接出错，请刷新页面重试。");
            };

            websocket.onclose = (event) => {
                console.log("WebSocket 关闭:", event.code, event.reason);
                if (event.code === 4000 && event.reason === "重复登录") {
                    alert("您的账号已在其他设备登录，当前会话已断开。");
                    window.location.href = "/web/login.html";
                } else if (event.code !== 1000) {
                    alert("连接异常断开，请重新登录。");
                    window.location.href = "/web/login.html";
                }
            };
        }

        // ========== 消息处理器 ==========
        function handleServerMessage(msg) {
            const type = msg.type;

            switch (type) {
                case 'auth_success':
                    username = msg.username;
                    currentUsernameEl.textContent = username;
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                    console.log("✅ 认证成功，用户名:", username);
                    break;

                case 'my_groups':
                    msg.groups.forEach(g => {
                        groupInfo[g.id] = g;
                    });
                    renderSessionList();
                    break;

                case 'my_friends':
                    // 好友列表用于标识私聊对象，但会话由消息触发
                    break;

                case 'online_users':
                    // 可用于更新在线状态图标（暂不实现）
                    break;

                case 'system':
                    displaySystemMessage(msg.text);
                    break;

                case 'friend_request':
                    const requester = msg.from;
                    cacheMessage(requester, msg);
                    if (currentSession && currentSession.target === requester) {
                        displayMessage(msg, false);
                    }
                    break;

                case 'message':
                    // 统一消息格式（历史 + 实时）
                    const sender = msg.sender;
                    const target = msg.target;
                    const chatType = msg.chat_type;

                    let sessionKey;
                    if (chatType === 'group') {
                        sessionKey = target;
                    } else {
                        sessionKey = (sender === username) ? target : sender;
                    }

                    cacheMessage(sessionKey, msg);

                    if (currentSession && currentSession.target === sessionKey) {
                        const isSent = (sender === username);
                        displayMessage(msg, isSent);
                    }
                    break;

                case 'group_created':
                    alert(`群聊创建成功！\n群ID: ${msg.group_id}\n群名: ${msg.group_name}`);
                    break;

                case 'group_joined':
                    alert(`已加入群聊: ${msg.group_name}`);
                    groupInfo[msg.group_id] = { name: msg.group_name };
                    cacheMessage(msg.group_id, {
                        type: 'system',
                        text: `你加入了群聊「${msg.group_name}」`,
                        timestamp: new Date().toISOString()
                    });
                    renderSessionList();
                    break;

                case 'group_left':
                    alert(`已退出群聊`);
                    break;

                default:
                    console.warn("未知消息类型:", type, msg);
            }
        }

        // ========== 缓存与渲染 ==========
        function cacheMessage(sessionKey, msg) {
            if (!sessions.has(sessionKey)) {
                sessions.set(sessionKey, []);
            }
            sessions.get(sessionKey).push(msg);
            renderSessionList();
        }

        function renderSessionList() {
            sessionListEl.innerHTML = '';

            // 构建会话项数组
            const sessionItems = [];
            for (const [target, msgs] of sessions.entries()) {
                if (msgs.length === 0) continue;
                const lastMsg = msgs[msgs.length - 1];
                const time = new Date(lastMsg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                let displayName = target;
                let type = 'private';
                if (target.startsWith('G')) {
                    type = 'group';
                    displayName = groupInfo[target]?.name || `群-${target}`;
                }

                sessionItems.push({ target, type, displayName, lastMsg, time });
            }

            // 按最后消息时间倒序
            sessionItems.sort((a, b) => 
                new Date(b.lastMsg.timestamp) - new Date(a.lastMsg.timestamp)
            );

            sessionItems.forEach(item => {
                const li = document.createElement('li');
                li.className = 'session-item';
                if (currentSession && currentSession.target === item.target) {
                    li.classList.add('active');
                }
                li.innerHTML = `
                    <span class="session-name">${item.displayName}</span>
                    <span class="session-time">${item.time}</span>
                `;
                li.onclick = () => {
                    switchSession(item.target, item.type, item.displayName);
                };
                sessionListEl.appendChild(li);
            });
        }

        function switchSession(target, type, name) {
            currentSession = { target, type, name };
            chatHeader.textContent = name;
            messagesEl.innerHTML = '';
            renderSessionList(); // 更新 active 状态

            // 显示该会话所有消息
            const msgs = sessions.get(target) || [];
            msgs.forEach(m => {
                if (m.type === 'message') {
                    const isSent = (m.sender === username);
                    displayMessage(m, isSent);
                } else if (m.type === 'system' || m.type === 'friend_request') {
                    displaySystemMessage(m.text);
                }
            });
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function displayMessage(msg, isSent) {
            const div = document.createElement('div');
            div.className = `message ${isSent ? 'sent' : 'received'}`;
            div.textContent = msg.content || msg.text || '';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function displaySystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'system-message';
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ========== 发送消息 ==========
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !currentSession) return;

            // 🟢 1. 立即在本地显示（模拟“已发送”）
            const localMsg = {
                type: 'message',
                sender: username,
                target: currentSession.target,
                chat_type: currentSession.type,
                content: content,
                timestamp: new Date().toISOString()
            };
            displayMessage(localMsg, true); // isSent = true

            // 🟢 2. 缓存到会话（用于历史记录）
            cacheMessage(currentSession.target, localMsg);

            // 🟢 3. 发送给服务端
            if (currentSession.type === 'private') {
                websocket.send(JSON.stringify({
                    type: 'private',
                    to: currentSession.target,
                    text: content
                }));
            } else if (currentSession.type === 'group') {
                websocket.send(JSON.stringify({
                    type: 'group',
                    to: currentSession.target,
                    text: content
                }));
            }

            messageInput.value = '';
            messageInput.focus(); // 可选：聚焦输入框
        }

        // ========== 群组操作 ==========
        createGroupBtn.addEventListener('click', () => {
            const name = prompt('请输入群聊名称:');
            if (name && name.trim()) {
                websocket.send(JSON.stringify({
                    type: 'create_group',
                    group_name: name.trim()
                }));
            }
        });

        joinGroupBtn.addEventListener('click', () => {
            const gid = prompt('请输入群ID (以 G 开头):');
            if (gid && gid.trim().startsWith('G')) {
                websocket.send(JSON.stringify({
                    type: 'join_group',
                    group_id: gid.trim()
                }));
            } else {
                alert('群ID必须以 G 开头！');
            }
        });

        // ========== 退出登录 ==========
        document.getElementById('logout-btn').addEventListener('click', function () {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.close();
            }
            // 清除本地凭证
            localStorage.removeItem('mo_chat_username');
            localStorage.removeItem('mo_chat_password');
            window.location.href = '/web/login.html';
        });

        // ========== 启动 ==========
        window.onload = function () {
            initWebSocket();
        };
    </script>
</body>
</html>
